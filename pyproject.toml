[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-company-os"
version = "0.1.0"
description = "Independent AI company roles with private local run records"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AI Company OS contributors"}]
dependencies = []

[project.scripts]
ai-company-os = "ai_company_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
